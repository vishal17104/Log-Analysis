services:

  db:
    image: postgres:15
    container_name: log_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smruti29
      POSTGRES_DB: log_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: log_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8501:8501"
    env_file:
      - .env

volumes:
  postgres_data: